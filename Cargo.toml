[package]
name = "liteview"
version = "0.1.0"
edition = "2024"
description = "Fast, local-first image viewer"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", features = ["persistence"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6.1"
qcms = "0.3.0"
rfd = "0.17.2"
sys-locale = "0.3.2"
thiserror = "2.0"

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]
tempfile = "3.23"
